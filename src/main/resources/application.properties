# =====================================================================
#  FILE CHUNG - commit lên Git. KHÔNG ghi mật khẩu thật của bạn vào đây.
#  Mật khẩu/cấu hình riêng từng máy để trong application-local.properties
#  (file đó bị .gitignore). Copy từ application-local.properties.example.
# =====================================================================
spring.application.name=waterbus

# Đọc thêm cấu hình riêng của máy bạn (nếu có). Giá trị trong file local sẽ ghi đè bên dưới.
spring.config.import=optional:classpath:application-local.properties

# --- SQL Server (giá trị mặc định, mỗi máy ghi đè trong file local) ---
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=WaterbusDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=CHANGE_ME_IN_application-local.properties
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# --- JPA / Hibernate ---
# Project mẫu dùng "update". Nhóm 4 người dùng "none": database tạo bằng script
# database/WaterbusDB_SQLServer.sql, để 4 máy luôn có CÙNG một schema
# (Hibernate không tự sửa bảng khác nhau trên từng máy).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# --- Server ---
server.port=8080
