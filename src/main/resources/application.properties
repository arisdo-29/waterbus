spring.application.name=waterbus

spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=WaterbusDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=CHANGE_ME_IN_application-local.properties
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

server.port=8080
