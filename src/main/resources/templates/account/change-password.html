<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đổi mật khẩu')}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đổi mật khẩu | Saigon Waterbus</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" href="/static/css/app.css" th:href="@{/css/app.css}">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="wb-main wb-page-main wb-auth-page">
        <div class="container">
            <div class="wb-auth-shell">
                <header class="wb-auth-head">
                    <span class="wb-eyebrow">Bảo mật</span>
                    <h1>Đổi mật khẩu</h1>
                    <p>Cập nhật mật khẩu mới cho tài khoản của bạn</p>
                </header>

                <div class="wb-card wb-form-card">
                    <form th:action="@{/account/change-password}" th:object="${changePasswordRequest}" method="post" novalidate>
                        <div class="wb-form-row">
                            <label for="currentPassword">Mật khẩu hiện tại <span class="wb-required" aria-hidden="true">*</span></label>
                            <div class="wb-password-field">
                                <input type="password" id="currentPassword" class="form-control" th:field="*{currentPassword}" required placeholder="Nhập mật khẩu hiện tại" th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid' : ''">
                                <button type="button" class="wb-password-toggle" data-password-toggle="currentPassword" aria-label="Hiện mật khẩu">
                                    <i class="bi bi-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}">Mật khẩu hiện tại không được để trống</div>
                        </div>

                        <div class="wb-form-row">
                            <label for="newPassword">Mật khẩu mới <span class="wb-required" aria-hidden="true">*</span></label>
                            <div class="wb-password-field">
                                <input type="password" id="newPassword" class="form-control" th:field="*{newPassword}" required minlength="6" placeholder="Tối thiểu 6 ký tự" th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid' : ''">
                                <button type="button" class="wb-password-toggle" data-password-toggle="newPassword" aria-label="Hiện mật khẩu">
                                    <i class="bi bi-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}">Mật khẩu mới tối thiểu 6 ký tự</div>
                        </div>

                        <div class="wb-form-row">
                            <label for="confirmPassword">Xác nhận mật khẩu mới <span class="wb-required" aria-hidden="true">*</span></label>
                            <div class="wb-password-field">
                                <input type="password" id="confirmPassword" class="form-control" th:field="*{confirmPassword}" required placeholder="Nhập lại mật khẩu mới" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''">
                                <button type="button" class="wb-password-toggle" data-password-toggle="confirmPassword" aria-label="Hiện mật khẩu">
                                    <i class="bi bi-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Mật khẩu xác nhận không khớp</div>
                        </div>

                        <div class="d-flex flex-column gap-2 mt-4">
                            <button type="submit" class="btn btn-wb-accent">
                                <i class="bi bi-shield-lock me-2" aria-hidden="true"></i>Xác nhận đổi mật khẩu
                            </button>
                            <a href="/templates/account/profile.html" th:href="@{/account/profile}" class="btn btn-wb-outline text-center">
                                Huỷ / Quay lại
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
