<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tạo chuyến tàu')}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tạo chuyến tàu | Saigon Waterbus</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" href="/static/css/app.css" th:href="@{/css/app.css}">
    <link rel="stylesheet" href="/static/css/admin.css" th:href="@{/css/admin.css}">
</head>
<body class="wb-admin">
    <nav th:replace="~{fragments/layout :: navbar}" class="navbar wb-navbar">
        <div class="container"><a class="navbar-brand wb-brand" href="/templates/index.html" th:href="@{/}"><img src="/static/img/logo.svg" th:src="@{/img/logo.svg}" alt="Saigon Waterbus"></a></div>
    </nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="wb-admin-layout">
        <aside th:replace="~{fragments/layout :: adminSidebar}" class="wb-admin-sidebar">
            <div class="wb-admin-side-head"><i class="bi bi-gear-wide-connected" aria-hidden="true"></i><span>Quản trị</span></div>
            <nav class="wb-admin-side-nav" aria-label="Menu quản trị">
                <a class="wb-admin-side-link" href="/templates/admin/trip/list.html" th:href="@{/admin/trips}" data-admin-nav="/admin/trips">Chuyến tàu</a>
                <a class="wb-admin-side-link" href="/templates/admin/waterbus/list.html" th:href="@{/admin/waterbuses}" data-admin-nav="/admin/waterbuses">Tàu</a>
                <a class="wb-admin-side-link" href="/templates/admin/station/list.html" th:href="@{/admin/stations}" data-admin-nav="/admin/stations">Bến</a>
                <a class="wb-admin-side-link" href="/templates/admin/route/list.html" th:href="@{/admin/routes}" data-admin-nav="/admin/routes">Tuyến</a>
                <a class="wb-admin-side-link" href="/templates/admin/promotion/list.html" th:href="@{/admin/promotions}" data-admin-nav="/admin/promotions">Khuyến mãi</a>
                <a class="wb-admin-side-link" href="/templates/admin/tickettype/list.html" th:href="@{/admin/ticket-types}" data-admin-nav="/admin/ticket-types">Loại vé</a>
            </nav>
            <a class="wb-admin-side-back" href="/templates/index.html" th:href="@{/}">Về trang khách</a>
        </aside>
        <main class="wb-main wb-admin-content">
            <button class="wb-admin-menu-toggle mb-4" type="button" data-admin-sidebar-toggle aria-controls="wbAdminSidebar" aria-expanded="false"><i class="bi bi-list" aria-hidden="true"></i>Menu quản trị</button>
            <header class="wb-admin-head">
                <div><span class="wb-eyebrow">Quản trị</span><h1>Tạo chuyến tàu</h1><p>Những mục có dấu * là bắt buộc.</p></div>
                <a class="btn btn-wb-outline" href="/templates/admin/trip/list.html" th:href="@{/admin/trips}"><i class="bi bi-arrow-left me-2" aria-hidden="true"></i>Danh sách</a>
            </header>
            <div class="wb-admin-form-layout">
                <section class="wb-admin-form-card">
                    <h2 class="wb-admin-form-title">Tạo chuyến tàu</h2>
                    <form action="/templates/admin/trip/list.html" th:action="@{/admin/trips/save}" method="post">
                        <div class="wb-admin-form-row">
                            <label for="routeId">Tuyến <span class="wb-admin-required" aria-hidden="true">*</span></label>
                            <select class="form-select" id="routeId" name="routeId" required>
                                <option value="">Chọn tuyến</option>
                                <option value="1" th:each="option : ${routes}" th:value="${option?.id}" th:text="${option?.name}" th:selected="${option?.id == trip?.routeId}">Tuyến mẫu</option>
                                <option value="2" th:remove="all">Lựa chọn mẫu khác</option>
                            </select>
                        </div>
                        <div class="wb-admin-form-row">
                            <label for="waterbusId">Tàu <span class="wb-admin-required" aria-hidden="true">*</span></label>
                            <select class="form-select" id="waterbusId" name="waterbusId" required>
                                <option value="">Chọn tàu</option>
                                <option value="1" th:each="option : ${waterbuses}" th:value="${option?.id}" th:text="${option?.name}" th:selected="${option?.id == trip?.waterbusId}">Tàu mẫu</option>
                                <option value="2" th:remove="all">Lựa chọn mẫu khác</option>
                            </select>
                        </div>
                        <div class="wb-admin-form-row">
                            <label for="departureTime">Giờ khởi hành <span class="wb-admin-required" aria-hidden="true">*</span></label>
                            <input class="form-control" id="departureTime" name="departureTime" type="datetime-local" value="" th:value="${trip?.departureTime == null ? '' : #temporals.format(trip.departureTime, 'yyyy-MM-dd') + 'T' + #temporals.format(trip.departureTime, 'HH:mm')}" required>
                        </div>
                        <div class="wb-admin-form-row">
                            <label for="status">Trạng thái <span class="wb-admin-required" aria-hidden="true">*</span></label>
                            <select class="form-select" id="status" name="status" required>
                                <option value="SCHEDULED" th:selected="${trip?.status == 'SCHEDULED' or trip == null}">Đã lên lịch</option>
                                <option value="DEPARTED" th:selected="${trip?.status == 'DEPARTED'}">Đã khởi hành</option>
                                <option value="COMPLETED" th:selected="${trip?.status == 'COMPLETED'}">Hoàn thành</option>
                                <option value="CANCELLED" th:selected="${trip?.status == 'CANCELLED'}">Đã huỷ</option>
                            </select>
                        </div>
                        <div class="wb-admin-form-actions">
                            <button class="btn btn-wb-accent" type="submit"><i class="bi bi-check-lg me-2" aria-hidden="true"></i>Lưu</button>
                            <a class="btn btn-wb-outline" href="/templates/admin/trip/list.html" th:href="@{/admin/trips}">Huỷ</a>
                        </div>
                    </form>
                </section>
                <aside class="wb-admin-side-card">
                    <h2>Trước khi lưu</h2>
                    <ul><li>Kiểm tra tuyến, tàu và giờ khởi hành.</li><li>Kiểm tra thông tin và trạng thái đang áp dụng.</li></ul>
                </aside>
            </div>
        </main>
    </div>
    <button class="wb-admin-backdrop" type="button" data-admin-sidebar-close aria-label="Đóng menu quản trị" hidden></button>
    <footer th:replace="~{fragments/layout :: footer}" class="wb-footer"><div class="container">Saigon Waterbus</div></footer>
    <th:block th:replace="~{fragments/layout :: scripts}">
        <script src="/static/js/bootstrap.bundle.min.js" th:src="@{/js/bootstrap.bundle.min.js}"></script>
        <script src="/static/js/app.js" th:src="@{/js/app.js}"></script>
    </th:block>
</body>
</html>
