<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đăng ký tài khoản')}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký | Saigon Waterbus</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" href="/static/css/app.css" th:href="@{/css/app.css}">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="wb-main wb-page-main wb-auth-page">
        <div class="container">
            <div class="wb-auth-shell">
                <header class="wb-auth-head">
                    <span class="wb-eyebrow">Tài khoản mới</span>
                    <h1>Đăng ký</h1>
                    <p>Tạo tài khoản để quản lý vé và nhận ưu đãi riêng.</p>
                </header>

                <div class="wb-card wb-form-card">
                    <form th:action="@{/auth/register}" th:object="${registerRequest}" method="post" novalidate>
                        <div class="wb-form-row">
                            <label for="fullName">Họ và tên <span class="wb-required" aria-hidden="true">*</span></label>
                            <input type="text" id="fullName" class="form-control" th:field="*{fullName}" placeholder="Nguyễn Văn A" required maxlength="100" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Họ và tên không hợp lệ</div>
                        </div>

                        <div class="wb-form-row">
                            <label for="email">Địa chỉ Email <span class="wb-required" aria-hidden="true">*</span></label>
                            <input type="email" id="email" class="form-control" th:field="*{email}" placeholder="example@email.com" required th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email không hợp lệ</div>
                        </div>

                        <div class="wb-form-row">
                            <label for="phone">Số điện thoại</label>
                            <input type="tel" id="phone" class="form-control" th:field="*{phone}" placeholder="0901234567" maxlength="20" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Số điện thoại không hợp lệ</div>
                        </div>

                        <div class="wb-form-row">
                            <label for="password">Mật khẩu <span class="wb-required" aria-hidden="true">*</span></label>
                            <div class="wb-password-field">
                                <input type="password" id="password" class="form-control" th:field="*{password}" placeholder="Tối thiểu 6 ký tự" required minlength="6" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''">
                                <button type="button" class="wb-password-toggle" data-password-toggle="password" aria-label="Hiện hoặc ẩn mật khẩu">
                                    <i class="bi bi-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Mật khẩu tối thiểu 6 ký tự</div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-wb-accent">
                                <i class="bi bi-person-plus me-2" aria-hidden="true"></i>Đăng ký tài khoản
                            </button>
                        </div>
                    </form>

                    <div class="wb-auth-foot">
                        <span>Đã có tài khoản?</span>
                        <a href="/templates/auth/login.html" th:href="@{/auth/login}" class="ms-1">Đăng nhập ngay</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
