<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Không tìm thấy trang')}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/app.css" th:href="@{/css/app.css}">

</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="wb-main wb-page-main wb-error-page">
        <section class="container">
            <div class="wb-error-shell">
                <svg class="wb-error-illustration" viewBox="0 0 120 120" role="img" aria-label="Phao cứu hội trên sóng">
                    <circle cx="60" cy="60" r="56" fill="#D9F0FB"></circle>
                    <path d="M10 78c12 6 24 6 36 0s24-6 36 0 18 6 28 0" fill="none" stroke="#8FD3F2" stroke-width="4" stroke-linecap="round"></path>
                    <path d="M10 92c12 6 24 6 36 0s24-6 36 0 18 6 28 0" fill="none" stroke="#8FD3F2" stroke-width="4" stroke-linecap="round" opacity="0.6"></path>
                    <circle cx="60" cy="52" r="26" fill="none" stroke="#0D6A99" stroke-width="6"></circle>
                    <circle cx="60" cy="52" r="26" fill="none" stroke="#FFC629" stroke-width="6" stroke-dasharray="10 8"></circle>
                    <circle cx="60" cy="52" r="10" fill="#0D6A99"></circle>
                </svg>
                <span class="wb-eyebrow">Lỗi 404</span>
                <h1>Trang bạn tìm không ở đây</h1>
                <p>Có thể trang đã bị di chuyển hoặc liên kết không còn hiệu lực. Hãy trở lại bến và tìm chuyến khác nhé.</p>
                <div class="wb-error-actions">
                    <a class="btn btn-wb-accent" href="/templates/index.html" th:href="@{/}">Về trang chủ <i class="bi bi-house ms-2" aria-hidden="true"></i></a>
                    <a class="btn btn-wb-outline" href="/templates/index.html#tim-chuyen" th:href="@{/#tim-chuyen}">Tìm chuyến <i class="bi bi-search ms-2" aria-hidden="true"></i></a>
                </div>
            </div>
        </section>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"><script src="/static/js/bootstrap.bundle.min.js"></script><script src="/static/js/app.js"></script></th:block>
</body>
</html>
