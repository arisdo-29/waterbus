<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Lỗi hệ thống')}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/app.css" th:href="@{/css/app.css}">

</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="wb-main wb-page-main wb-error-page">
        <section class="container">
            <div class="wb-error-shell">
                <svg class="wb-error-illustration" viewBox="0 0 120 120" role="img" aria-label="Con tàu trên sóng">
                    <circle cx="60" cy="60" r="56" fill="#D9F0FB"></circle>
                    <path d="M8 84c14 6 28 6 42 0s28-6 42 0 14 6 20 0" fill="none" stroke="#8FD3F2" stroke-width="4" stroke-linecap="round"></path>
                    <path d="M30 70l8-20h32l8 20z" fill="#0D6A99"></path>
                    <rect x="50" y="34" width="4" height="22" fill="#0D6A99"></rect>
                    <path d="M52 36l14 10-14 6z" fill="#FFC629"></path>
                    <circle cx="44" cy="74" r="3" fill="#fff"></circle>
                    <circle cx="60" cy="74" r="3" fill="#fff"></circle>
                    <circle cx="76" cy="74" r="3" fill="#fff"></circle>
                </svg>
                <span class="wb-eyebrow">Lỗi 500</span>
                <h1>Tàu tạm thời neo lại</h1>
                <p>Hệ thống đang gặp chút sự cố. Vui lòng thử lại sau ít phút hoặc liên hệ hotline 1900 636 830 để được hỗ trợ.</p>
                <div class="wb-error-actions">
                    <a class="btn btn-wb-accent" href="/templates/index.html" th:href="@{/}">Về trang chủ <i class="bi bi-house ms-2" aria-hidden="true"></i></a>
                    <button class="btn btn-wb-outline" type="button" data-action="reload"><i class="bi bi-arrow-clockwise me-2" aria-hidden="true"></i>Thử lại</button>
                </div>
            </div>
        </section>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"><script src="/static/js/bootstrap.bundle.min.js"></script><script src="/static/js/app.js"></script></th:block>
</body>
</html>
