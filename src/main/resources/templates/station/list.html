<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Bến tàu')}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/app.css" th:href="@{/css/app.css}">
  </head>
  <body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <main class="wb-main wb-page-main">
      <section class="container wb-page-heading">
        <span class="wb-eyebrow">Điểm lên tàu</span>
        <h1>Bến tàu</h1>
        <p>Danh sách các bến tàu trên tuyến đường sông Sài Gòn.</p>
      </section>
      <section class="container wb-section-top">
        <div class="wb-card wb-station-filter">
          <label for="stationFilter" class="visually-hidden">Tìm bến tàu</label>
          <div class="wb-station-filter-input">
            <i class="bi bi-search" aria-hidden="true"></i>
                    <input class="form-control" id="stationFilter" type="search" placeholder="Tìm theo tên hoặc địa chỉ bến" data-station-filter>
          </div>
          <p class="wb-station-filter-count" data-station-count th:text="${'Có ' + (stations == null ? 0 : #lists.size(stations)) + ' bến tàu'}">
            Có 5 bến tàu
          </p>
        </div>
      </section>
      <section class="container wb-section-top">
        <div th:if="${#lists.isEmpty(stations)}" class="wb-card wb-empty-state">
          <i class="bi bi-geo-alt wb-empty-icon" aria-hidden="true"></i>
          <h2>Chưa có bến tàu</h2>
          <p>Thông tin các bến tàu sẽ sớm được cập nhật.</p>
        </div>
        <div th:unless="${#lists.isEmpty(stations)}" class="row g-3 g-lg-4 wb-station-grid" data-station-grid>
          <div class="col-12 col-md-6 col-xl-4" th:each="s : ${stations}">
            <a class="wb-card wb-station-card" href="/templates/station/view.html" th:href="@{/stations/{id}(id=${s.id})}">
                        <span class="wb-station-card-icon"><i class="bi bi-water" aria-hidden="true"></i></span>
                        <div class="wb-station-card-body">
                            <span class="wb-mono wb-muted-text" th:text="${s.code}">BD</span><strong th:text="${s.name}">Bạch Đằng</strong>
                            <small th:text="${s.address}">Quận 1, TP.HCM</small>
                        </div>
                        <span class="wb-station-card-status"><span class="badge rounded-pill" th:classappend="${s.isActive} ? 'wb-badge-success' : 'wb-badge-muted'" th:text="${s.isActive} ? 'Hoạt động' : 'Tạm ngưng'">Hoạt động</span></span>
                    </a>
          </div>
        </div>
        <p class="wb-station-empty-filter wb-muted-text" data-station-empty hidden>Không tìm thấy bến tàu phù hợp.</p>
      </section>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}">
      <script src="/static/js/bootstrap.bundle.min.js"></script><script src="/static/js/app.js"></script>
    </th:block>
  </body>
</html>
