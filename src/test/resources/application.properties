# Cấu hình CHỈ dùng khi chạy test (mvnw test) và trên GitHub Actions.
# Dùng H2 trong RAM giả lập SQL Server -> không cần cài SQL Server để test khởi động app.
spring.application.name=waterbus-test
spring.datasource.url=jdbc:h2:mem:waterbus;MODE=MSSQLServer;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=12345
spring.datasource.driver-class-name=org.h2.Driver
# Hibernate tự tạo bảng từ entity -> nếu entity map sai, test sẽ báo lỗi ngay.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
